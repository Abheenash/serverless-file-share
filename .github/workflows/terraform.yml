name: terraform

on:
  pull_request:
    paths: ["terraform/**", "src/**", "web/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "src/**", "web/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  # Always runs, no AWS credentials needed: format + syntax + internal consistency.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Runs on PRs only if an OIDC role is configured (repo variable AWS_ROLE_ARN).
  # Prereqs: a remote backend (see terraform/README.md) and a GitHub OIDC IAM role.
  plan:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      # Real backend now that state is remote. The values come from repo
      # variables so no account id is committed.
      - name: terraform init (remote state)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=serverless-file-share/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform plan -input=false

  # Applies on merge to main, gated behind a protected environment for manual approval.
  apply:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      # Real backend now that state is remote. The values come from repo
      # variables so no account id is committed.
      - name: terraform init (remote state)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=serverless-file-share/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform apply -auto-approve -input=false

  # tflint catches what `terraform validate` cannot: unused declarations, missing
  # provider version constraints, invalid instance types. It found an unpinned
  # `archive` provider in two of these repos.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ github.workspace }}
        # GITHUB_TOKEN is not optional here. `tflint --init` downloads the ruleset
        # plugins from the GitHub releases API, and unauthenticated that call shares
        # a rate limit with every other runner on the same egress IP -- so it works
        # until the day the account is busy, then fails with "403 API rate limit
        # exceeded" having linted nothing. That is exactly how it broke: merging a
        # batch of dependency PRs ran enough CI to exhaust it. The token is issued
        # to every workflow run automatically and needs no setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  # `terraform test` against a mocked provider: no cloud account, no cost, and it
  # asserts the specific promises this repo's README makes — which a generic
  # scanner cannot know.
  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test
