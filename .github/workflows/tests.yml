name: tests
on: [push, pull_request]
jobs:
  lambdas:
    name: pytest (moto + real S3/DynamoDB/SES via LocalStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r tests/requirements.txt

      # S3_SKIP_SIGNATURE_VALIDATION=0 is the setting that makes the presigned-URL
      # tests mean anything. LocalStack's default is to accept any signature, and
      # with that default the test that tampers with a signature and expects a 403
      # gets a 200 instead — it fails loudly rather than passing vacuously, which
      # is the right way round, but the flag is what makes it pass honestly.
      - name: start LocalStack
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e SERVICES=s3,dynamodb,dynamodbstreams,ses \
            -e S3_SKIP_SIGNATURE_VALIDATION=0 \
            localstack/localstack:4.9
          for _ in $(seq 1 60); do
            if curl -s http://127.0.0.1:4566/_localstack/health | grep -q '"s3"'; then
              echo "LocalStack is up"; exit 0
            fi
            sleep 3
          done
          echo "::error::LocalStack never became healthy"; docker logs localstack; exit 1

      # REQUIRE_LOCALSTACK=1 makes a missing endpoint an error rather than eight
      # quiet skips behind a green tick.
      - run: python -m pytest tests -q
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          REQUIRE_LOCALSTACK: "1"

      - if: always()
        run: docker rm -f localstack || true
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false

  # Lint, including bandit's security rules. Every exclusion in ruff.toml carries
  # the reason it is there — a silent exclusion is indistinguishable from a bug
  # nobody noticed.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.8
          args: check --output-format github

  # GitHub's semantic analysis, free on public repos, reporting into the Security
  # tab. It reads data flow across files, which neither ruff nor checkov does.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  # Blocks a PR that introduces a dependency with a known vulnerability or a
  # licence that does not fit. Renovate keeps things current; this stops a bad
  # one arriving in the first place.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Requires "Dependency graph" enabled in repo settings, which a workflow
    # cannot turn on for itself. Non-blocking so a repo without it reports the
    # gap instead of failing every PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
